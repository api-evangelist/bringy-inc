aid: bringy-inc
name: Bringy, Inc.
description: >-
  Bringy, Inc. is a digital insurance brokerage operating in Egypt, founded in
  2019 and licensed by the Egyptian Financial Regulatory Authority (FRA License
  #100). Through its website and iOS/Android mobile apps, Bringy lets consumers
  compare, select, purchase, and manage insurance policies online, positioning
  itself as a digital insurance advisor that guides customers from policy
  selection through claims and compensation. Coverage lines include car,
  business, medical, personal-accident, and home insurance, with payment via
  Visa, Mastercard, Meeza, mobile wallets, and installment providers (ValU,
  Sympl, Souhoola). Bringy was surfaced as a portfolio company of 500 Global and
  added to the API Evangelist network. It publishes a consumer marketing site
  and blog but no public developer API, SDKs, or developer documentation at this
  time.
